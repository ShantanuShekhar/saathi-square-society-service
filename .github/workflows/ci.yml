name: Build - Society Service

on:
  push:
    branches: [ "feature/init-society-module" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Society Service
        run: |
          echo "🚀 Starting build for Society Service..."
          mvn -B clean package -DskipTests -f saathi-square-society-service/society-service/pom.xml
          echo "✅ Build completed successfully!"
