name: Build & Deploy - Society Service (Local Docker)

on:
  push:
    branches: [ "feature/init-society-module" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted  # your mac-runner

    steps:
      - name: 🧭 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Build Society Service with Maven
        run: |
          echo "🚀 Building society service module..."
          cd /Users/shantanushekhar/Desktop/Backend/runner/actions-runner/saathi-square/saathi-square-society-service/society-service
          mvn clean package -DskipTests
          echo "✅ Build complete."

      - name: 🐳 Deploy using Docker Compose
        run: |
          echo "🐳 Deploying all services via docker-compose..."
          cd /Users/shantanushekhar/Desktop/Backend/runner/actions-runner/saathi-square
          docker-compose down || true
          docker-compose build --no-cache
          docker-compose up -d
          echo "✅ Deployment successful! 🎉"

      - name: 🔍 Verify Running Containers
        run: docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
