name: Build & Deploy - Society Service (Local Docker)

on:
  push:
    branches: [ "feature/init-society-module" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted  # Your Mac self-hosted runner

    steps:
      - name: 🧭 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Build Society Service with Maven
        working-directory: ./society-service
        run: |
          echo "🚀 Starting Maven build for Society Service..."
          mvn -B clean package -DskipTests
          echo "✅ Maven build complete!"

      - name: 🐳 Deploy using Docker Compose
        run: |
          echo "🐳 Starting Docker deployment..."
          docker-compose -f docker-compose.yml down || true
          docker-compose -f docker-compose.yml build --no-cache
          docker-compose -f docker-compose.yml up -d
          echo "✅ Deployment successful! 🎉"

      - name: 🔍 Verify Running Containers
        run: docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
