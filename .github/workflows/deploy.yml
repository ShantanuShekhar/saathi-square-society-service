name: Build & Deploy - Society Service (Local Docker)

on:
  push:
    branches: [ "feature/init-society-module" ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: self-hosted  # your mac-runner

    steps:
      - name: 🧭 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Build Society Service with Maven
        run: |
          echo "🚀 Building society service module..."
          cd society-service
          mvn clean package -DskipTests
          echo "✅ Build complete."

      - name: 🐳 Deploy using Docker Compose
        run: |
          echo "🐳 Deploying all services via docker-compose..."
          cd /Users/shantanushekhar/LevelUp/Project/Backend/saathi-square
          pwd
          ls -l
          if [ -f "docker-compose.yml" ]; then
            echo "✅ docker-compose.yml found, starting deployment..."
            docker-compose down || true
            docker-compose build --no-cache
            docker-compose up -d
            echo "🎉 Deployment successful!"
          else
            echo "❌ docker-compose.yml not found at $(pwd)"
            exit 1
          fi

      - name: 🔍 Verify Running Containers
        run: docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"