spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/society_service?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: society_user
    password: society_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://registry-service:8761/eureka/
  instance:
    prefer-ip-address: true

rbac-service:
  base-url: http://rbac-service:8080/rbac

server:
  port: 1011
